site_name: 神秘复苏百科
site_description: 《神秘复苏》世界观百科 · 逐章考据 · 忠于原著
# navigation.instant（即时加载/无闪屏）要求设 site_url。运行时按 location.origin 判断内部链接，
# 故此处填线上地址即可，本地 iframe 同源也照样生效（仅用于满足"必须设"的前提）。
site_url: https://zhushen-space.pages.dev/wiki-shenmi/
docs_dir: docs
# 内置进前端用 iframe 加载：必须用扁平 .html（false），否则目录式 URL（/wiki-shenmi/某页/）在 SPA
# 静态服务下会被 index.html 兜底重写回游戏本体。false → 每页生成真实 .html + 相对链接，任何静态/SPA 部署都能解析。
use_directory_urls: false
# 构建产物直接落到 zhushen 的 public/wiki-shenmi/，App 里用 iframe 加载（/wiki-shenmi/index.html，离线）。
# ⚠ 与轮回乐园百科（public/wiki/）分属两个目录，勿改成同一个——会互相覆盖。
site_dir: ../zhushen-space/zhushen-space/public/wiki-shenmi

theme:
  name: material
  language: zh
  logo: assets/favicon.svg
  favicon: assets/favicon.svg
  palette:
    # 配色用 teal，与轮回乐园百科的 cyan 区分开：两站同时内置，一眼能认出在哪本书里
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: 切换到深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色
  features:
    # 即时加载：点条目用 fetch 换内容而非整页重载 → 消除 iframe 切页白屏闪烁（类 SPA 体验）
    - navigation.instant
    - navigation.instant.progress   # 慢网/手机端：>400ms 才显顶部细进度条
    - navigation.tabs
    - navigation.indexes
    # ⚠ 必需：不剪枝时 Material 会把整棵 nav 嵌进每一页，单页 HTML 随条目数线性膨胀。
    # prune 只渲染当前页所在分支，导航行为不变。
    - navigation.prune
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html          # 首页 grid cards 需要
  - tables
  - toc:
      permalink: true

plugins:
  - search              # 装了 jieba 后 Material 自动用它做中文分词（见 requirements.txt）

# 构建后处理：把 search_index.json 压进 Cloudflare Pages 的单文件 25MiB 上限之内。
# 本站体量（~290 万字）紧凑序列化一步即可达标，截断分支基本不会触发。
hooks:
  - hooks/shrink_search.py

validation:
  nav:
    omitted_files: info
    not_found: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

